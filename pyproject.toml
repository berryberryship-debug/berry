[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "axioms-quantumlab"
version = "0.1.0"
description = "Architecture autopoïétique et moteur solitonique"
dependencies = [
    "numpy",
    "scipy"
]

[project.optional-dependencies]
nis = [
    "numpy>=1.26",
    "scipy>=1.11",
    "pandas>=2.2",
    "matplotlib>=3.8",
    "PyYAML>=6.0",
]
dev = [
    "pytest>=8.0",
]

[tool.setuptools.packages.find]
where = ["src"]

[project.scripts]
nonlinear-nis = "nonlinear_information_system.cli:main"
